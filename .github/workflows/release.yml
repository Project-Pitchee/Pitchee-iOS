name: Release IPA

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v1.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate requested tag shape
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Release requires a vX.Y.Z version tag.')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive
          persist-credentials: false
      - name: Compare tag with project marketing version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 Scripts/ci/release-validation.py
      - name: Check generated articles
        id: articles
        run: python3 Scripts/build-voice-training-library.py --check
      - name: Validate localizations
        id: localizations
        if: ${{ !cancelled() }}
        run: python3 Scripts/validate-localizations.py
      - name: Record release validation result
        if: always()
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          ARTICLES_OUTCOME: ${{ steps.articles.outcome }}
          LOCALIZATIONS_OUTCOME: ${{ steps.localizations.outcome }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          report = '\n'.join([
              '## Release validation',
              f"- Articles: {os.environ['ARTICLES_OUTCOME']}",
              f"- Localizations: {os.environ['LOCALIZATIONS_OUTCOME']}",
              '- After validation, GitHub Actions builds an unsigned IPA for sideload re-signing and attaches it to this release.',
              '- The vX.Y.Z tag starts the Xcode Cloud Release archive and TestFlight workflow.',
              '- Beta Review and App Store submission remain manual.',
          ]) + '\n'
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write(report)
          PY

  ipa:
    name: Build and upload unsigned IPA
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive
          persist-credentials: false
      - name: Confirm the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - name: Restore native build dependencies
        run: bash Scripts/bootstrap-native-dependencies.sh
      - name: Archive the iOS app without signing
        run: |
          mkdir -p .build/release
          set -o pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild archive -project Pitchee.xcodeproj -scheme Pitchee \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath .build/release/Pitchee.xcarchive \
            -derivedDataPath .build/release-derived \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${RELEASE_TAG#v}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            2>&1 | tee .build/release/xcodebuild.log
      - name: Verify and package the unsigned IPA
        run: |
          app=.build/release/Pitchee.xcarchive/Products/Applications/Pitchee.app
          python3 ci_scripts/verify-built-version.py --app "$app" \
            --bundle-id com.rolvy.Pitchee --tag "$RELEASE_TAG" --expected-build "$GITHUB_RUN_NUMBER"
          test -x "$app/Pitchee"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneOS
          mkdir -p .build/release/package/Payload
          ditto "$app" .build/release/package/Payload/Pitchee.app
          ditto -c -k --norsrc --keepParent .build/release/package/Payload \
            ".build/release/Pitchee-${RELEASE_TAG}-unsigned.ipa"
          unzip -tq ".build/release/Pitchee-${RELEASE_TAG}-unsigned.ipa"
      - name: Preserve the unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pitchee-${{ env.RELEASE_TAG }}-unsigned
          path: .build/release/*.ipa
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Attach the IPA to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" ".build/release/Pitchee-${RELEASE_TAG}-unsigned.ipa" \
            --repo "$GITHUB_REPOSITORY" --clobber
          printf '\nUploaded `Pitchee-%s-unsigned.ipa`. Re-sign with a sideloading tool before installation.\n' \
            "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve archive logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archive-logs-${{ env.RELEASE_TAG }}
          path: .build/release/xcodebuild.log
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
