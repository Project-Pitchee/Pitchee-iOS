name: Screenshots

on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Catalog languages, separated by spaces, or all'
        default: 'zh-Hans en'
        required: true
        type: string
      appearances:
        description: 'Appearance'
        default: light
        required: true
        type: choice
        options: [light, dark, 'light dark']

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        env:
          LANGUAGES: ${{ inputs.languages }}
          APPEARANCES: ${{ inputs.appearances }}
        run: |
          matrix=$(python3 Screenshots/matrix.py --languages "$LANGUAGES" --appearances "$APPEARANCES")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  capture:
    needs: matrix
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Restore native dependencies
        run: bash Scripts/bootstrap-native-dependencies.sh
      - name: Capture five screens
        env:
          DEVICE: ${{ matrix.device }}
          LANGUAGE: ${{ matrix.language }}
          APPEARANCE: ${{ matrix.appearance }}
        run: |
          python3 Screenshots/capture.py --device "$DEVICE" --language "$LANGUAGE" --appearance "$APPEARANCE"
      - name: Save screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.device }}-${{ matrix.language }}-${{ matrix.appearance }}
          path: .build/screenshots-output
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
